<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/white-logo.svg">
  <link rel="stylesheet" href="css/admin-common.css">
  <link rel="stylesheet" href="css/product-admin.css">
  <link rel="stylesheet" href="css/profile-admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div>
        <div class="admin-brand">
          <div class="admin-brand-logo">
            <img src="../assets/icons/white-logo.svg" alt="Zandle Studio Logo">
          </div>
          <span class="admin-brand-title">Zandle Studio</span>
        </div>
        <nav class="admin-nav">
          <a href="dashboard-admin.html" class="admin-nav-item">
            <img src="../assets/icons/admin-dashboard.svg" alt="" aria-hidden="true">
            <span>Dashboard</span>
          </a>
          <a href="pesanan-admin.html" class="admin-nav-item">
            <img src="../assets/icons/admin-orders.svg" alt="" aria-hidden="true">
            <span>Pesanan</span>
          </a>
          <a href="product-admin.html" class="admin-nav-item">
            <img src="../assets/icons/admin-products.svg" alt="" aria-hidden="true">
            <span>Produk</span>
          </a>
          <a href="laporan-admin.html" class="admin-nav-item">
            <img src="../assets/icons/admin-reports.svg" alt="" aria-hidden="true">
            <span>Laporan</span>
          </a>
          <a href="profile-admin.html" class="admin-nav-item active">
            <img src="../assets/icons/admin-profile.svg" alt="" aria-hidden="true">
            <span>Profil</span>
          </a>
        </nav>
      </div>
      <div class="admin-sidebar-bottom">
        <a href="#">
          <img src="../assets/icons/admin-settings.svg" alt="" aria-hidden="true">
          <span>Pengaturan Sistem</span>
        </a>
        <a href="index.html">
          <img src="../assets/icons/admin-logout.svg" alt="" aria-hidden="true">
          <span>Keluar</span>
        </a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 class="admin-header-title">Profil Admin</h1>
        <div class="admin-header-actions">
          <div class="admin-search-wrapper">
            <input type="text" class="admin-search-input" placeholder="Cari...">
          </div>
          <a href="profile-admin.html" class="admin-avatar-btn" title="Profil Admin">
            <img src="../assets/icons/admin-avatar.svg" alt="Admin Avatar">
          </a>
        </div>
      </header>

      <section class="admin-content">
        <div class="profile-container">
          <div class="admin-card profile-avatar-card">
            <div class="profile-avatar-large">
              <img id="profileAvatarImg" src="../assets/icons/admin-avatar.svg" alt="Much Aqilla Al - Hayyu">
            </div>
            <input type="file" id="avatarFileInput" accept="image/png, image/jpeg" style="display: none;">
            <button type="button" class="btn-upload-photo" id="uploadPhotoBtn">Ubah Foto</button>
            <span class="profile-avatar-hint">Maks 2MB · JPG, PNG</span>
          </div>

          <div class="admin-card profile-details-card">
            <form id="profileForm">
              <h2 class="profile-section-heading">Informasi Akun</h2>
              <div class="profile-form-grid">
                <div class="admin-form-group">
                  <label class="admin-form-label" for="adminName">NAMA ADMIN</label>
                  <input type="text" id="adminName" class="admin-form-input" value="Much Aqilla Al - Hayyu" required>
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label" for="adminEmail">EMAIL</label>
                  <input type="email" id="adminEmail" class="admin-form-input" value="hayyuganteng77@zandle.id" required>
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label" for="adminPhone">NO. TELEPON</label>
                  <input type="tel" id="adminPhone" class="admin-form-input" value="+62 812 3456 7890">
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label" for="adminRole">ROLE</label>
                  <input type="text" id="adminRole" class="admin-form-input" value="Super Admin" readonly style="background: #f5f5f4; cursor: not-allowed;">
                </div>
              </div>

              <h2 class="profile-section-heading">Ganti Password</h2>
              <div class="profile-form-grid">
                <div class="admin-form-group" style="grid-column: span 2;">
                  <label class="admin-form-label" for="oldPassword">PASSWORD LAMA</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="oldPassword" class="admin-form-input" value="12345678" placeholder="Masukkan password lama">
                    <button type="button" class="password-toggle-btn" aria-label="Tampilkan kata sandi">
                      <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="admin-form-group">
                  <label class="admin-form-label" for="newPassword">PASSWORD BARU</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="newPassword" class="admin-form-input" placeholder="Minimal 8 karakter">
                    <button type="button" class="password-toggle-btn" aria-label="Tampilkan kata sandi">
                      <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="admin-form-group">
                  <label class="admin-form-label" for="confirmPassword">KONFIRMASI PASSWORD</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="confirmPassword" class="admin-form-input" placeholder="Ulangi password baru">
                    <button type="button" class="password-toggle-btn" aria-label="Tampilkan kata sandi">
                      <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button type="reset" class="btn-secondary">Reset</button>
                <button type="submit" class="btn-primary">Simpan Perubahan</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/admin-common.js"></script>
  <script src="js/profile-admin.js"></script>
</body>
</html>
