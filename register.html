<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — Zandle Studio</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body style="background: #ffffff;">

  <div class="auth-container">
    <div class="auth-art-side">
      <img src="assets/images/right-gray-panel.svg" alt="Zandle Studio Art" class="auth-pattern-bg">
    </div>

    <div class="auth-form-side">
      <a href="index.html" class="auth-brand">
        <img src="assets/icons/logo.png" alt="Zandle Studio">
        <span>Zandle Studio</span>
      </a>

      <h1 class="auth-title">Buat Akun Baru</h1>

      <form action="index.html" method="get">
        <div class="auth-input-group">
          <label>Nama Lengkap</label>
          <input type="text" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="auth-input-group">
          <label>Email</label>
          <input type="email" placeholder="nama@email.com" required>
        </div>

        <div class="auth-input-group">
          <label>Kata Sandi</label>
          <input type="password" placeholder="Minimal 8 karakter" required>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 20px;">
          <input type="checkbox" id="terms" checked required style="width: auto; height: auto; margin-top: 3px;">
          <label for="terms" style="font-size: 12px; font-weight: normal; margin: 0; color: var(--text-body); cursor: pointer;">
            Saya setuju dengan <a href="#" style="color: var(--color-brown-text); font-weight: 600;">Syarat & Ketentuan</a> serta <a href="#" style="color: var(--color-brown-text); font-weight: 600;">Kebijakan Privasi</a> Zandle Studio.
          </label>
        </div>

        <a href="login.html" class="btn-auth-submit">Daftar Sekarang</a>
      </form>

      <div class="auth-divider">
        <span>atau daftar melalui</span>
      </div>

      <div class="social-auth-row">
        <a href="index.html" class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </a>
        <a href="index.html" class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000000" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.84.94-2.91-1 .04-2.19.67-2.88 1.47-.57.66-1.07 1.74-.93 2.8 1.12.09 2.24-.59 2.87-1.36z"/></svg>
          Apple
        </a>
      </div>

      <p class="auth-footer-prompt">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </p>
    </div>
  </div>

  <div class="auth-modal-backdrop" id="authModal">
    <div class="auth-modal-card">
      <div class="auth-modal-icon">!</div>
      <h3 class="auth-modal-title" id="authModalTitle">Perhatian</h3>
      <p class="auth-modal-message" id="authModalMsg"></p>
      <button type="button" class="auth-modal-btn" id="authModalClose">Mengerti</button>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
